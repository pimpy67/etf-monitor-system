family_detection:
- pattern:
  - monetario
  - liquidita
  - money market
  family: monetario_liquidita
- pattern:
  - asia - emergente
  - america latina
  - africa & middle
  - europa dell'est
  family: mercati_emergenti
- pattern:
  - settoriale - tecnolog
  - settoriale - energia
  - settoriale - industri
  - settoriale - finanza
  family: settoriali_growth
- pattern:
  - settoriale - salute
  - settoriale - consumi
  family: settoriali_difensivi
- pattern:
  - obbligazionari - governativi
  - obbligazionari - globali
  - obbligazionari - inflation
  family: bond_governativi
- pattern:
  - obbligazionari - corporate
  - obbligazionari - high yield
  - obbligazionari - emergenti
  - obbligazionari - aggregati
  family: bond_corp_hy_em
- pattern:
  - materie prime
  - settoriale - materie prime
  family: commodities
- pattern:
  - oro
  - metalli preziosi
  family: oro_metalli_preziosi
- pattern:
  - metalli industriali
  family: metalli_industriali
- pattern:
  - real estate
  - reit
  - infrastrutture
  family: real_estate_reit
- pattern:
  - crypto
  family: crypto_digital_assets
- pattern:
  - leva singolo
  - volatilita
  - strutturati
  family: leva_single_stock
- pattern:
  - private equity
  family: private_equity_buffer
- pattern:
  - stati uniti
  - europa occidentale
  - giappone
  - globale
  - azionario
  - canada
  - australasia
  - regno unito
  - asia - paesi sviluppati
  family: equity_sviluppati
default_family: equity_sviluppati
