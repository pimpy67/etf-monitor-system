<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafoglio — ETF Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-text-primary: #1f2937;
            --color-text-muted: #6b7280;
            --color-border: #e5e7eb;
            --color-hover: #f3f4f6;
            --color-bg: #ffffff;
            --color-bg-secondary: #f9fafb;
            --color-safe: #10b981;
            --color-warning: #f59e0b;
            --color-danger: #ef4444;
            --color-neutral: #9ca3af;
            --color-primary: #3b82f6;
            --color-primary-hover: #1d4ed8;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-text-primary: #f9fafb;
                --color-text-muted: #d1d5db;
                --color-border: #374151;
                --color-hover: #1f2937;
                --color-bg: #111827;
                --color-bg-secondary: #1f2937;
                --color-safe: #34d399;
                --color-warning: #fbbf24;
                --color-danger: #f87171;
                --color-neutral: #9ca3af;
                --color-primary: #3b82f6;
                --color-primary-hover: #1d4ed8;
                --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
                --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
            }
        }

        html {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            color-scheme: light dark;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text-primary);
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        /* Header */
        .header {
            margin-bottom: 32px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-primary {
            background-color: var(--color-primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--color-primary-hover);
        }

        .btn-icon {
            width: 32px;
            height: 32px;
            padding: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            background-color: var(--color-bg-secondary);
            border: 1px solid var(--color-border);
        }

        .btn-icon:hover {
            background-color: var(--color-hover);
        }

        .btn-icon svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        .header-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            padding: 16px;
            background-color: var(--color-bg-secondary);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            font-family: 'IBM Plex Mono', monospace;
            letter-spacing: -0.5px;
        }

        .stat-value.positive {
            color: var(--color-safe);
        }

        .stat-value.negative {
            color: var(--color-danger);
        }

        .timestamp {
            font-size: 12px;
            color: var(--color-text-muted);
            margin-top: 8px;
        }

        /* Loading state */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 16px;
            color: var(--color-text-muted);
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--color-border);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Positions Grid */
        .positions-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .position-card {
            background-color: var(--color-bg-secondary);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 20px;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .position-card:hover {
            border-color: var(--color-primary);
            box-shadow: var(--shadow-md);
        }

        .position-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .position-info {
            flex: 1;
        }

        .position-ticker {
            font-size: 20px;
            font-weight: 700;
            font-family: 'IBM Plex Mono', monospace;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .position-name {
            font-size: 13px;
            color: var(--color-text-muted);
            margin-bottom: 4px;
            word-break: break-word;
        }

        .position-date {
            font-size: 11px;
            color: var(--color-text-muted);
        }

        .position-pct {
            font-size: 18px;
            font-weight: 600;
            font-family: 'IBM Plex Mono', monospace;
            padding: 4px 8px;
            border-radius: 4px;
            background-color: var(--color-hover);
        }

        .position-pct.positive {
            color: var(--color-safe);
        }

        .position-pct.negative {
            color: var(--color-danger);
        }

        /* Prices Section */
        .prices-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--color-border);
        }

        .price-field {
            display: flex;
            flex-direction: column;
        }

        .price-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .price-value {
            font-size: 16px;
            font-weight: 600;
            font-family: 'IBM Plex Mono', monospace;
            letter-spacing: -0.5px;
        }

        .price-date {
            font-size: 10px;
            color: var(--color-text-muted);
            margin-top: 2px;
        }

        /* Stop Loss Section */
        .sl-section {
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--color-border);
        }

        .sl-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .sl-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sl-values {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .sl-item {
            flex: 1;
            padding: 8px 12px;
            background-color: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: 4px;
            text-align: center;
        }

        .sl-item.inserted {
            border-color: var(--color-primary);
            background-color: rgba(59, 130, 246, 0.05);
        }

        .sl-item-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .sl-item-value {
            font-size: 14px;
            font-weight: 700;
            font-family: 'IBM Plex Mono', monospace;
            letter-spacing: -0.5px;
        }

        .sl-item-subtitle {
            font-size: 9px;
            color: var(--color-text-muted);
            margin-top: 2px;
            font-style: italic;
        }

        /* SL Distance Bar */
        .sl-distance-bar {
            position: relative;
            height: 24px;
            border-radius: 4px;
            overflow: hidden;
            background: linear-gradient(90deg, var(--color-safe) 0%, var(--color-warning) 50%, var(--color-danger) 100%);
            margin-bottom: 12px;
        }

        .sl-distance-fill {
            position: absolute;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
            transition: width 0.4s ease;
        }

        .sl-distance-text {
            font-size: 11px;
            font-weight: 600;
            color: white;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            font-family: 'IBM Plex Mono', monospace;
            letter-spacing: -0.5px;
        }

        .sl-distance-info {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            font-size: 11px;
        }

        .sl-distance-item {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--color-text-muted);
        }

        .sl-distance-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        /* Action Buttons */
        .position-actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
        }

        .btn-accept-sl {
            flex: 1;
            padding: 10px 12px;
            background-color: var(--color-primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-accept-sl:hover {
            background-color: var(--color-primary-hover);
        }

        .btn-accept-sl:active {
            transform: scale(0.98);
        }

        .btn-accept-sl:disabled {
            background-color: var(--color-neutral);
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--color-bg);
            border-radius: 8px;
            padding: 32px;
            max-width: 400px;
            width: 100%;
            box-shadow: var(--shadow-md);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .modal-body {
            margin-bottom: 24px;
        }

        .modal-detail {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .modal-detail-label {
            color: var(--color-text-muted);
            font-weight: 500;
        }

        .modal-detail-value {
            font-weight: 600;
            font-family: 'IBM Plex Mono', monospace;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .btn-cancel {
            flex: 1;
            padding: 10px;
            background-color: var(--color-bg-secondary);
            border: 1px solid var(--color-border);
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--color-text-primary);
        }

        .btn-cancel:hover {
            background-color: var(--color-hover);
        }

        .btn-confirm {
            flex: 1;
            padding: 10px;
            background-color: var(--color-primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-confirm:hover {
            background-color: var(--color-primary-hover);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 48px 16px;
            color: var(--color-text-muted);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-text {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .empty-subtext {
            font-size: 14px;
            margin-bottom: 24px;
        }

        /* Error state */
        .error-banner {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--color-danger);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            color: var(--color-danger);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .error-banner svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .error-message {
            font-size: 14px;
            flex: 1;
        }

        .error-close {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
            padding: 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 16px 12px;
            }

            .header-title {
                font-size: 24px;
            }

            .positions-container {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .position-card {
                padding: 16px;
            }

            .header-stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .position-header {
                flex-direction: column;
                margin-bottom: 12px;
            }

            .position-pct {
                margin-top: 8px;
                align-self: flex-start;
            }

            .prices-section {
                margin-bottom: 12px;
                padding-bottom: 12px;
            }

            .modal-content {
                padding: 24px;
                max-width: 100%;
            }
        }

        /* Animations */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .position-card {
            animation: slideIn 0.3s ease;
        }

        /* Alert icon for close SL */
        .alert-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            margin-left: 4px;
        }

        .alert-icon svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-top">
                <h1 class="header-title">Portafoglio</h1>
                <div class="header-actions">
                    <button class="btn-icon" id="refreshBtn" title="Manual refresh" aria-label="Refresh positions">
                        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
                            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"></path>
                        </svg>
                    </button>
                    <button class="btn btn-primary" id="addPositionBtn">+ Nuova Posizione</button>
                </div>
            </div>

            <!-- Stats -->
            <div class="header-stats" id="statsContainer">
                <div class="stat-card">
                    <div class="stat-label">Posizioni Totali</div>
                    <div class="stat-value" id="totalPositions">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Gain/Loss Aggregato</div>
                    <div class="stat-value" id="aggregateGainLoss">—</div>
                    <div class="timestamp" id="aggregatePct" style="font-size: 12px;"></div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Ultimo Aggiornamento</div>
                    <div class="timestamp" id="lastUpdateTime" style="font-size: 14px; font-weight: 600; margin: 8px 0; color: var(--color-text-primary);">—</div>
                    <div class="timestamp" id="autoUpdateStatus"></div>
                </div>
            </div>
        </div>

        <!-- Error Banner -->
        <div id="errorBanner" class="error-banner" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <div class="error-message" id="errorMessage"></div>
            <button class="error-close" onclick="document.getElementById('errorBanner').style.display = 'none';" aria-label="Close error">×</button>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="loading" style="display: none;">
            <div class="spinner"></div>
            <span>Caricamento posizioni...</span>
        </div>

        <!-- Positions Container -->
        <div id="positionsContainer" class="positions-container"></div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-icon">📊</div>
            <div class="empty-text">Nessuna posizione attiva</div>
            <div class="empty-subtext">Aggiungi una nuova posizione per iniziare</div>
            <button class="btn btn-primary" id="emptyAddBtn">+ Nuova Posizione</button>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmationModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">Conferma accettazione SL</div>
            <div class="modal-body">
                <div class="modal-detail">
                    <span class="modal-detail-label">Ticker</span>
                    <span class="modal-detail-value" id="modalTicker">—</span>
                </div>
                <div class="modal-detail">
                    <span class="modal-detail-label">SL Attuale</span>
                    <span class="modal-detail-value" id="modalCurrentSL">—</span>
                </div>
                <div class="modal-detail">
                    <span class="modal-detail-label">Nuovo SL</span>
                    <span class="modal-detail-value" id="modalNewSL">—</span>
                </div>
                <div class="modal-detail">
                    <span class="modal-detail-label">Distanza prezzo</span>
                    <span class="modal-detail-value" id="modalDistance">—</span>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeConfirmation()">Annulla</button>
                <button class="btn-confirm" id="confirmBtn" onclick="confirmAcceptSL()">Accetta SL</button>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const CONFIG = {
            apiBase: '',
            refreshInterval: 5 * 60 * 1000, // 5 minutes
            dataFetchTimeout: 10000, // 10 seconds
        };

        let positionsData = [];
        let refreshTimer = null;
        let lastUpdateTime = null;
        let pendingConfirmation = null;

        // === Initialization ===
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Portfolio Tracker initialized');
            fetchPositions();
            setupEventListeners();
            startAutoRefresh();
        });

        // === Event Listeners ===
        function setupEventListeners() {
            document.getElementById('refreshBtn').addEventListener('click', () => {
                console.log('Manual refresh triggered');
                fetchPositions();
            });

            document.getElementById('addPositionBtn').addEventListener('click', () => {
                alert('Funzionalità "Aggiungi Posizione" disponibile nel prossimo aggiornamento');
            });

            document.getElementById('emptyAddBtn').addEventListener('click', () => {
                alert('Funzionalità "Aggiungi Posizione" disponibile nel prossimo aggiornamento');
            });

            // Close modal on background click
            document.getElementById('confirmationModal').addEventListener('click', (e) => {
                if (e.target.id === 'confirmationModal') {
                    closeConfirmation();
                }
            });
        }

        // === Data Fetching ===
        async function fetchPositions() {
            const loadingEl = document.getElementById('loadingState');
            const errorBannerEl = document.getElementById('errorBanner');
            const errorMessageEl = document.getElementById('errorMessage');

            loadingEl.style.display = 'flex';
            errorBannerEl.style.display = 'none';

            try {
                const response = await fetch(`${CONFIG.apiBase}/api/portfolio-sl`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' },
                    timeout: CONFIG.dataFetchTimeout,
                });

                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }

                const data = await response.json();
                positionsData = data.positions || [];
                lastUpdateTime = new Date(data.timestamp);

                console.log('Positions fetched:', positionsData.length);
                renderPositions();
                updateStats();
                updateTimestamp();
            } catch (error) {
                console.error('Error fetching positions:', error);
                errorMessageEl.textContent = `Errore nel caricamento: ${error.message}`;
                errorBannerEl.style.display = 'flex';

                // Show empty state on error
                if (positionsData.length === 0) {
                    renderEmptyState();
                }
            } finally {
                loadingEl.style.display = 'none';
            }
        }

        // === Rendering ===
        function renderPositions() {
            const container = document.getElementById('positionsContainer');
            const emptyStateEl = document.getElementById('emptyState');

            if (positionsData.length === 0) {
                container.innerHTML = '';
                emptyStateEl.style.display = 'block';
                return;
            }

            emptyStateEl.style.display = 'none';
            container.innerHTML = positionsData
                .map((position, index) => createPositionCard(position, index))
                .join('');

            // Add event listeners to all buttons
            positionsData.forEach((position) => {
                const btn = document.getElementById(`btn-accept-${position.ticker}`);
                if (btn) {
                    btn.addEventListener('click', () => openConfirmation(position));
                }
            });
        }

        function createPositionCard(position, index) {
            const {
                ticker,
                fund_name,
                entry_date,
                entry_price,
                current_price,
                price_date,
                pct_change,
                sl_inserted,
                sl_suggested,
            } = position;

            const pctNum = parseFloat(pct_change) || 0;
            const pctClass = pctNum >= 0 ? 'positive' : 'negative';
            const pctSign = pctNum >= 0 ? '+' : '';

            const slDistance = calculateSLDistance(current_price, sl_inserted, sl_suggested);
            const slColor = getSLColor(slDistance.percentage);
            const showAcceptBtn = sl_suggested && sl_inserted !== sl_suggested;

            const alertIcon = slDistance.percentage < 5 ? '<span class="alert-icon" title="SL molto vicino"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg></span>' : '';

            return `
                <div class="position-card">
                    <div class="position-header">
                        <div class="position-info">
                            <div class="position-ticker">${escapeHtml(ticker)}</div>
                            <div class="position-name">${escapeHtml(fund_name)}</div>
                            <div class="position-date">Entrata: ${formatDate(entry_date)}</div>
                        </div>
                        <div class="position-pct ${pctClass}">${pctSign}${pctNum.toFixed(2)}%</div>
                    </div>

                    <div class="prices-section">
                        <div class="price-field">
                            <div class="price-label">Prezzo Entrata</div>
                            <div class="price-value">${formatPrice(entry_price)}</div>
                        </div>
                        <div class="price-field">
                            <div class="price-label">Prezzo Attuale</div>
                            <div class="price-value">${formatPrice(current_price)}</div>
                            <div class="price-date">${formatDate(price_date)}</div>
                        </div>
                    </div>

                    <div class="sl-section">
                        <div class="sl-header">
                            <div class="sl-label">Stop Loss ${alertIcon}</div>
                        </div>
                        <div class="sl-values">
                            <div class="sl-item inserted">
                                <div class="sl-item-label">Inserito</div>
                                <div class="sl-item-value">${formatPrice(sl_inserted)}</div>
                                ${sl_suggested && sl_suggested !== sl_inserted ? '<div class="sl-item-subtitle">da suggerimento</div>' : '<div class="sl-item-subtitle">manuale</div>'}
                            </div>
                            ${sl_suggested && sl_suggested !== sl_inserted ? `
                                <div class="sl-item">
                                    <div class="sl-item-label">Suggerito</div>
                                    <div class="sl-item-value">${formatPrice(sl_suggested)}</div>
                                    <div class="sl-item-subtitle">aggiornato</div>
                                </div>
                            ` : ''}
                        </div>

                        <div class="sl-distance-bar">
                            <div class="sl-distance-fill" style="width: ${slDistance.percentage}%;">
                                <span class="sl-distance-text">${slDistance.percentage.toFixed(0)}%</span>
                            </div>
                        </div>
                        <div class="sl-distance-info">
                            <div class="sl-distance-item">
                                <span class="sl-distance-dot" style="background-color: var(--color-safe);"></span>
                                <span>Sicuro</span>
                            </div>
                            <div class="sl-distance-item">
                                <span class="sl-distance-dot" style="background-color: var(--color-warning);"></span>
                                <span>Attenzione</span>
                            </div>
                            <div class="sl-distance-item">
                                <span class="sl-distance-dot" style="background-color: var(--color-danger);"></span>
                                <span>Pericolo</span>
                            </div>
                        </div>
                    </div>

                    ${showAcceptBtn ? `
                        <div class="position-actions">
                            <button class="btn-accept-sl" id="btn-accept-${ticker}">Accetta SL Suggerito</button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderEmptyState() {
            const container = document.getElementById('positionsContainer');
            const emptyStateEl = document.getElementById('emptyState');
            container.innerHTML = '';
            emptyStateEl.style.display = 'block';
        }

        // === Stats & Updates ===
        function updateStats() {
            const totalEl = document.getElementById('totalPositions');
            const gainLossEl = document.getElementById('aggregateGainLoss');
            const gainLossPctEl = document.getElementById('aggregatePct');

            totalEl.textContent = positionsData.length;

            if (positionsData.length === 0) {
                gainLossEl.textContent = '—';
                gainLossPctEl.textContent = '';
                return;
            }

            let totalGainLoss = 0;
            let totalInvested = 0;

            positionsData.forEach((pos) => {
                const invested = parseFloat(pos.entry_price) * 1; // Assuming 1 unit per position (adjust if needed)
                const current = parseFloat(pos.current_price) * 1;
                const gainLoss = current - invested;

                totalGainLoss += gainLoss;
                totalInvested += invested;
            });

            const pctChange = totalInvested > 0 ? (totalGainLoss / totalInvested) * 100 : 0;
            const gainLossClass = pctChange >= 0 ? 'positive' : 'negative';
            const gainLossSign = pctChange >= 0 ? '+' : '';

            gainLossEl.textContent = `${gainLossSign}${pctChange.toFixed(2)}%`;
            gainLossEl.className = `stat-value ${gainLossClass}`;
            gainLossPctEl.textContent = `${gainLossSign}€ ${totalGainLoss.toFixed(2)}`;
        }

        function updateTimestamp() {
            const timeEl = document.getElementById('lastUpdateTime');
            const statusEl = document.getElementById('autoUpdateStatus');

            if (lastUpdateTime) {
                timeEl.textContent = lastUpdateTime.toLocaleTimeString('it-IT');
                const minutesAgo = Math.floor((Date.now() - lastUpdateTime) / 60000);
                statusEl.textContent = minutesAgo === 0 ? 'Ora' : `${minutesAgo}m fa`;
            }
        }

        // === Auto Refresh ===
        function startAutoRefresh() {
            if (refreshTimer) clearInterval(refreshTimer);
            refreshTimer = setInterval(() => {
                console.log('Auto-refresh triggered');
                fetchPositions();
            }, CONFIG.refreshInterval);
        }

        // === Modal Confirmation ===
        function openConfirmation(position) {
            pendingConfirmation = position;
            const modal = document.getElementById('confirmationModal');
            const slDistance = calculateSLDistance(position.current_price, position.sl_inserted, position.sl_suggested);

            document.getElementById('modalTicker').textContent = position.ticker;
            document.getElementById('modalCurrentSL').textContent = formatPrice(position.sl_inserted);
            document.getElementById('modalNewSL').textContent = formatPrice(position.sl_suggested);
            document.getElementById('modalDistance').textContent = `${slDistance.percentage.toFixed(2)}% di distanza`;

            modal.classList.add('active');
        }

        function closeConfirmation() {
            const modal = document.getElementById('confirmationModal');
            modal.classList.remove('active');
            pendingConfirmation = null;
        }

        async function confirmAcceptSL() {
            if (!pendingConfirmation) return;

            const { ticker, sl_suggested } = pendingConfirmation;
            const confirmBtn = document.getElementById('confirmBtn');
            confirmBtn.disabled = true;
            confirmBtn.textContent = 'Elaborazione...';

            try {
                const response = await fetch(`${CONFIG.apiBase}/api/accept-sl-suggestion`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ticker, sl_value: sl_suggested }),
                });

                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }

                const result = await response.json();
                console.log('SL accepted:', result);

                // Update local data
                const pos = positionsData.find((p) => p.ticker === ticker);
                if (pos) {
                    pos.sl_inserted = sl_suggested;
                }

                closeConfirmation();
                renderPositions();
            } catch (error) {
                console.error('Error accepting SL:', error);
                alert(`Errore: ${error.message}`);
            } finally {
                confirmBtn.disabled = false;
                confirmBtn.textContent = 'Accetta SL';
            }
        }

        // === Utilities ===
        function calculateSLDistance(currentPrice, slInserted, slSuggested) {
            const current = parseFloat(currentPrice) || 0;
            const inserted = parseFloat(slInserted) || 0;
            const suggested = parseFloat(slSuggested) || 0;

            if (inserted === 0) return { percentage: 0, distance: 0 };

            const distance = current - inserted;
            const maxDistance = current - inserted; // Max distance is from entry to current
            const percentage = maxDistance > 0 ? Math.min(100, Math.max(0, (distance / (current - inserted)) * 100)) : 0;

            return { percentage: isNaN(percentage) ? 0 : Math.max(0, 100 - Math.abs((current - inserted) / inserted * 100)), distance };
        }

        function getSLColor(percentage) {
            if (percentage > 85) return 'var(--color-safe)';
            if (percentage > 50) return 'var(--color-warning)';
            return 'var(--color-danger)';
        }

        function formatPrice(price) {
            const num = parseFloat(price);
            if (isNaN(num)) return '—';
            return num.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function formatDate(dateStr) {
            try {
                const date = new Date(dateStr);
                return date.toLocaleDateString('it-IT', { year: '2-digit', month: '2-digit', day: '2-digit' });
            } catch {
                return dateStr;
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;',
            };
            return text.replace(/[&<>"']/g, (m) => map[m]);
        }

        // === Cleanup ===
        window.addEventListener('beforeunload', () => {
            if (refreshTimer) clearInterval(refreshTimer);
        });
    </script>
</body>
</html>
